name: vs-network

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      STRATUM_URL: ${STRATUM_URL}
      NIMBUS_URL: ${NIMBUS_URL}
      STRATUM_MODE: ${STRATUM_MODE}
      PUID: ${PUID}
      PGID: ${PGID}
  image: vs-network/backend:local
  user: "${PUID}:${PGID}"
  restart: unless-stopped
  # Vintage Story sauvegarde le monde a l'arret. Laisser le temps de finir.
  stop_grace_period: 2m
  depends_on:
    - nimbus
  networks: [vsnet]

services:
  # Seul service expose. Les joueurs ne voient que cette adresse.
  nimbus:
    build:
      context: .
      dockerfile: proxy/Dockerfile
      args:
        NIMBUS_URL: ${NIMBUS_URL}
    image: vs-network/proxy:local
    restart: unless-stopped
    ports:
      - "${PROXY_PORT}:${PROXY_PORT}"
      # Metriques Prometheus, joignables depuis la machine hote uniquement.
      - "127.0.0.1:${METRICS_PORT}:${METRICS_PORT}"
    environment:
      PROXY_PORT: ${PROXY_PORT}
      REGISTRY_PORT: ${REGISTRY_PORT}
      METRICS_PORT: ${METRICS_PORT}
      DEFAULT_BACKEND: survival
      SURVIVAL_ADDR: survival:${SURVIVAL_PORT}
      CREATIVE_ADDR: creative:${CREATIVE_PORT}
      NIMBUS_SHARED_SECRET: ${NIMBUS_SHARED_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      REDIRECT_ADDRESS: ${REDIRECT_ADDRESS:-}
    networks: [vsnet]

  survival:
    <<: *backend
    volumes:
      - ./worlds/survival:/data
    environment:
      VS_SERVER_NAME: "Survie"
      VS_WORLD_NAME: "Survie"
      VS_DEFAULT_ROLE: suplayer
      VS_PLAYSTYLE: surviveandbuild
      VS_PLAYSTYLE_LANG: surviveandbuild-bands
      VS_PORT: ${SURVIVAL_PORT}
      VS_MAX_CLIENTS: ${MAX_CLIENTS}
      VS_WHITELIST_MODE: ${VS_WHITELIST_MODE:-1}
      VS_ADMINS: ${VS_ADMINS:-}
      # Exigence de rivers, sa fiche Mod DB dit : "Oceans are required to
      # generate rivers. 300-500% landcover scale and 50% landcover works good."
      # Dans les libelles du jeu, "Landcover scale" est la cle oceanscale.
      #
      # Ce sont les VALEURS qu'il faut ecrire, pas les libelles. AssemblyInfo.cs
      # de VSSurvivalMod definit landcover values ["0"..."1"] pour des noms
      # ["~0%".."100%"], et oceanscale values ["0.1".."5"] pour ["10%".."500%"].
      # GenMaps fait worldConfig.GetString(...).ToFloat(1f), et ToFloat s'appuie
      # sur float.TryParse en NumberStyles.Any, qui refuse le signe pourcent.
      # Ecrire "50%" retombe donc sur 1, soit 100% de terre et aucun ocean.
      #
      # 0.5 / 4 suivait la fiche de rivers a la lettre, mais donnait un point
      # d apparition sur un ilot isole. 0.7 laisse plus de terre, 3 rapproche les
      # cotes en reduisant la taille des masses. On reste dans la fourchette
      # 300-500% que rivers demande pour le landcover scale.
      VS_WORLDCONFIG: '{"landcover":"0.5","oceanscale":"4"}'
      NIMBUS_SERVER_ID: survival
      NIMBUS_DISPLAY_NAME: "Survie"
      NIMBUS_PUBLIC_HOST: survival
      NIMBUS_PUBLIC_PORT: ${SURVIVAL_PORT}
      NIMBUS_REGISTRY_URL: http://nimbus:${REGISTRY_PORT}
      NIMBUS_SHARED_SECRET: ${NIMBUS_SHARED_SECRET}
      NIMBUS_RESERVATION_REQUIRED: "true"
      # Raccourcis Nimbus 0.3.0. Targets est une chaine de repli, le premier
      # backend enregistre, sain et different de celui-ci l emporte. Inutile de
      # declarer un raccourci vers soi-meme, il ne serait jamais retenu.
      NIMBUS_SHORTCUTS: '[{"Name":"crea","Targets":["creative"],"Description":"Rejoindre le monde creatif"}]'

  creative:
    <<: *backend
    volumes:
      - ./worlds/creative:/data
    environment:
      VS_SERVER_NAME: "Creatif"
      VS_WORLD_NAME: "Creatif"
      # crplayer porte DefaultGameMode 2, soit creatif pour tout arrivant.
      VS_DEFAULT_ROLE: crplayer
      VS_PLAYSTYLE: creativebuilding
      VS_PLAYSTYLE_LANG: creativebuilding
      # Le playstyle creativebuilding declare "worldType": "superflat" dans
      # VSCreativeMod. Sans ca on retombe sur "standard" et le monde a du relief.
      VS_WORLDTYPE: superflat
      VS_PORT: ${CREATIVE_PORT}
      VS_MAX_CLIENTS: ${MAX_CLIENTS}
      VS_WHITELIST_MODE: ${VS_WHITELIST_MODE:-1}
      VS_ADMINS: ${VS_ADMINS:-}
      # betterruins + Stratum + playstyle creativebuilding fait planter la passe
      # de structures. Le meme mod ne pose aucun probleme sur la survie.
      MODS_EXCLUDE: "betterruins-0.6.3.zip"
      NIMBUS_SERVER_ID: creative
      NIMBUS_DISPLAY_NAME: "Creatif"
      NIMBUS_PUBLIC_HOST: creative
      NIMBUS_PUBLIC_PORT: ${CREATIVE_PORT}
      NIMBUS_REGISTRY_URL: http://nimbus:${REGISTRY_PORT}
      NIMBUS_SHARED_SECRET: ${NIMBUS_SHARED_SECRET}
      NIMBUS_RESERVATION_REQUIRED: "true"
      NIMBUS_SHORTCUTS: '[{"Name":"survie","Targets":["survival"],"Description":"Retourner sur la survie"}]'

networks:
  vsnet:
    driver: bridge
