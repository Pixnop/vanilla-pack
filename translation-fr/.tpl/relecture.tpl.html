<title>Relecture des traductions FR</title>
<style>
  :root{
    --bg:#f3f5f4; --surface:#fff; --surface-2:#eceff0; --line:#d9e0de;
    --text:#141b1a; --muted:#68807c; --accent:#16786a; --accent-soft:#dcefea;
    --flag:#9a6410; --flag-soft:#f6e9d4; --ko:#a33b30; --ko-soft:#f7e2df;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1315; --surface:#161c1e; --surface-2:#1c2427; --line:#28353a;
      --text:#dde5e3; --muted:#7f918f; --accent:#57b8a2; --accent-soft:#15302c;
      --flag:#d3a054; --flag-soft:#2e2415; --ko:#e0796a; --ko-soft:#33201c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1315; --surface:#161c1e; --surface-2:#1c2427; --line:#28353a;
    --text:#dde5e3; --muted:#7f918f; --accent:#57b8a2; --accent-soft:#15302c;
    --flag:#d3a054; --flag-soft:#2e2415; --ko:#e0796a; --ko-soft:#33201c;
  }
  :root[data-theme="light"]{
    --bg:#f3f5f4; --surface:#fff; --surface-2:#eceff0; --line:#d9e0de;
    --text:#141b1a; --muted:#68807c; --accent:#16786a; --accent-soft:#dcefea;
    --flag:#9a6410; --flag-soft:#f6e9d4; --ko:#a33b30; --ko-soft:#f7e2df;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:10;background:var(--surface);
         border-bottom:1px solid var(--line);padding:13px 20px;
         display:flex;flex-wrap:wrap;gap:11px;align-items:center}
  h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap}
  .stats{display:flex;gap:13px;font-size:12.5px;color:var(--muted);
         font-variant-numeric:tabular-nums}
  .stats b{color:var(--text);font-weight:600}
  .stats .ok b{color:var(--accent)} .stats .no b{color:var(--ko)}
  .grow{flex:1 1 190px}
  input[type=search],select{font:inherit;font-size:13.5px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
    padding:7px 10px;width:100%}
  select{width:auto;min-width:145px}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px}
  .segs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .segs button{font:inherit;font-size:13px;padding:7px 12px;border:0;cursor:pointer;
    background:var(--surface-2);color:var(--muted);border-right:1px solid var(--line)}
  .segs button:last-child{border-right:0}
  .segs button[aria-pressed=true]{background:var(--accent);color:var(--bg);font-weight:600}
  .ghost{font:inherit;font-size:13px;padding:7px 12px;cursor:pointer;border-radius:7px;
    background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}

  main{padding:16px 20px 70px;max-width:1500px;margin:0 auto}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:9px;
       padding:11px 13px;margin-bottom:8px;border-left-width:3px}
  .row.flagged{border-color:var(--flag)}
  .row[data-v=ok]{border-left-color:var(--accent);opacity:.6}
  .row[data-v=ko]{border-left-color:var(--ko)}
  .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:7px}
  .key{font-family:var(--mono);font-size:11.5px;color:var(--muted);
       word-break:break-all;flex:1 1 auto}
  .dom{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
       color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:4px}
  .chip{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
        color:var(--flag);background:var(--flag-soft);padding:2px 7px;border-radius:4px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:760px){.pair{grid-template-columns:1fr;gap:7px}}
  .cell{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13.5px}
  .cell.en{color:var(--muted)}
  .cell b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
          color:var(--muted);margin-bottom:3px;font-weight:600;opacity:.75}
  .verdict{display:flex;gap:6px;margin-top:9px}
  .verdict button{font:inherit;font-size:12px;padding:4px 11px;cursor:pointer;
    border-radius:6px;background:transparent;color:var(--muted);border:1px solid var(--line)}
  .verdict button:hover{color:var(--text)}
  .verdict button[data-a=ok][aria-pressed=true]{background:var(--accent-soft);
    color:var(--accent);border-color:var(--accent);font-weight:600}
  .verdict button[data-a=ko][aria-pressed=true]{background:var(--ko-soft);
    color:var(--ko);border-color:var(--ko);font-weight:600}
  mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
  .empty{color:var(--muted);padding:44px 0;text-align:center}
  #more{display:block;margin:14px auto;font:inherit;font-size:13.5px;padding:9px 18px;
    background:var(--surface);color:var(--text);border:1px solid var(--line);
    border-radius:7px;cursor:pointer}
  #more:hover{border-color:var(--accent);color:var(--accent)}
</style>

<header>
  <h1>Relecture FR</h1>
  <div class="stats">
    <span><b>__TOTAL__</b> chaînes</span>
    <span><b>__FLAGGED__</b> signalées</span>
    <span class="ok"><b id="nOk">0</b> validées</span>
    <span class="no"><b id="nKo">0</b> à corriger</span>
    <span id="shown"></span>
  </div>
  <div class="grow"><input type="search" id="q" placeholder="Chercher dans les clés, l'anglais ou le français…"></div>
  <select id="dom"><option value="">Tous les mods</option></select>
  <div class="segs">
    <button id="bFlag" aria-pressed="true">Signalées</button>
    <button id="bTodo" aria-pressed="false">Non revues</button>
    <button id="bAll" aria-pressed="false">Tout</button>
  </div>
  <button class="ghost" id="exp">Exporter mes retours</button>
</header>

<main><div id="list"></div><button id="more" hidden>Afficher la suite</button></main>

<script>
const ROWS = JSON.parse(`__DATA__`);
const KEY='vsfr-relecture';
let verdicts={};
try{verdicts=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){verdicts={};}

const list=document.getElementById('list'), more=document.getElementById('more'),
      q=document.getElementById('q'), domSel=document.getElementById('dom'),
      shown=document.getElementById('shown'), nOk=document.getElementById('nOk'),
      nKo=document.getElementById('nKo'),
      bFlag=document.getElementById('bFlag'), bTodo=document.getElementById('bTodo'),
      bAll=document.getElementById('bAll'), exp=document.getElementById('exp');
let mode='flag', cursor=0, current=[];
const PAGE=60, id=r=>r[0]+'|'+r[1];

[...new Set(ROWS.map(r=>r[0]))].sort().forEach(d=>{
  const o=document.createElement('option'); o.value=d;
  o.textContent=d+' ('+ROWS.filter(r=>r[0]===d).length+')'; domSel.append(o);
});

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,t){
  const e=esc(s); if(!t) return e;
  try{return e.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}
  catch(_){return e;}
}
function counts(){
  const v=Object.values(verdicts);
  nOk.textContent=v.filter(x=>x==='ok').length;
  nKo.textContent=v.filter(x=>x==='ko').length;
}
function save(){localStorage.setItem(KEY,JSON.stringify(verdicts));counts();}

function filter(){
  const t=q.value.trim().toLowerCase(), d=domSel.value;
  current=ROWS.filter(r=>{
    if(mode==='flag' && !r[4].length) return false;
    if(mode==='todo' && verdicts[id(r)]) return false;
    if(d && r[0]!==d) return false;
    if(!t) return true;
    return r[1].toLowerCase().includes(t)||r[2].toLowerCase().includes(t)||r[3].toLowerCase().includes(t);
  });
  cursor=0; list.textContent=''; render();
}
function render(){
  const t=q.value.trim();
  const slice=current.slice(cursor,cursor+PAGE);
  const frag=document.createDocumentFragment();
  for(const r of slice){
    const k=id(r), v=verdicts[k]||'';
    const el=document.createElement('article');
    el.className='row'+(r[4].length?' flagged':''); el.dataset.v=v; el.dataset.id=k;
    el.innerHTML='<div class="meta"><span class="dom">'+esc(r[0])+'</span>'+
      r[4].map(f=>'<span class="chip">'+esc(f)+'</span>').join('')+
      '<span class="key">'+hl(r[1],t)+'</span></div>'+
      '<div class="pair"><div class="cell en"><b>Anglais</b>'+hl(r[2],t)+'</div>'+
      '<div class="cell"><b>Français</b>'+hl(r[3],t)+'</div></div>'+
      '<div class="verdict">'+
      '<button data-a="ok" aria-pressed="'+(v==='ok')+'">Correcte</button>'+
      '<button data-a="ko" aria-pressed="'+(v==='ko')+'">À corriger</button></div>';
    frag.append(el);
  }
  list.append(frag);
  cursor+=slice.length;
  more.hidden = cursor>=current.length;
  shown.innerHTML='<b>'+current.length+'</b> affichées';
  if(!current.length) list.innerHTML='<p class="empty">Rien ne correspond.</p>';
}
list.addEventListener('click',e=>{
  const b=e.target.closest('.verdict button'); if(!b) return;
  const row=b.closest('.row'), k=row.dataset.id, a=b.dataset.a;
  verdicts[k] = verdicts[k]===a ? undefined : a;
  if(!verdicts[k]) delete verdicts[k];
  row.dataset.v=verdicts[k]||'';
  row.querySelectorAll('.verdict button').forEach(x=>x.ariaPressed=(verdicts[k]===x.dataset.a));
  save();
});
exp.onclick=()=>{
  const out=ROWS.filter(r=>verdicts[id(r)]).map(r=>({
    mod:r[0], cle:r[1], en:r[2], fr:r[3], verdict:verdicts[id(r)]}));
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='relecture-fr.json'; a.click();
  URL.revokeObjectURL(a.href);
};
more.onclick=render;
q.oninput=filter; domSel.onchange=filter;
function seg(m,btn){mode=m;[bFlag,bTodo,bAll].forEach(b=>b.ariaPressed=(b===btn));filter();}
bFlag.onclick=()=>seg('flag',bFlag);
bTodo.onclick=()=>seg('todo',bTodo);
bAll.onclick=()=>seg('all',bAll);
counts(); filter();
</script>
